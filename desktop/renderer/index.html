<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none';" />
  <title>DOMEO · Подбор по корзине</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="app">
      <span class="logo">DOMEO</span>
      <div class="htext">
        <h1>Подбор по корзине</h1>
      </div>
      <div class="htools">
        <span id="ver" class="ver"></span>
        <button id="btnUpd" class="ghost">Обновления</button>
      </div>
    </header>

    <div id="updbar" class="updbar" hidden></div>

    <!-- основной путь: читаем корзину прямо во встроенном браузере -->
    <div id="browserwrap" class="browserwrap">
      <div class="quick">
        <button class="chipbtn" data-url="https://petrovich.ru/">Петрович</button>
        <button class="chipbtn" data-url="https://www.vseinstrumenti.ru/">ВсеИнструменты</button>
        <button class="chipbtn" data-url="https://lemanapro.ru/">Lemana</button>
        <button class="chipbtn" data-url="https://store.domeo.ru/">DOMEO (вход)</button>
        <button id="read" class="primary">Прочитать корзину из окна</button>
      </div>
      <div class="bbar">
        <button id="back" class="navbtn" title="Назад">‹</button>
        <button id="fwd" class="navbtn" title="Вперёд">›</button>
        <button id="reload" class="navbtn" title="Обновить">⟳</button>
        <span id="addr" class="addr"></span>
      </div>
      <webview id="wv" src="https://store.domeo.ru/" partition="persist:domeo" allowpopups></webview>
    </div>

    <details class="manual">
      <summary>…или вставить список вручную (из закладки / мессенджера)</summary>
      <div class="panel">
        <textarea id="input" spellcheck="false"
          placeholder="Список позиций — по одной в строке. Ссылку сюда вставлять не нужно."></textarea>
        <div class="controls">
          <button class="primary" id="run">Подобрать по списку</button>
          <button id="sample">Пример</button>
          <button id="clear">Очистить</button>
          <span id="progress" class="hint" style="align-self:center"></span>
        </div>
      </div>
    </details>

    <div id="progress2" class="progress2"></div>

    <div id="summary" class="summary" hidden></div>

    <div id="result" class="tablewrap" hidden>
      <table>
        <thead><tr>
          <th style="width:34%">Позиция из корзины</th>
          <th style="width:42%">Подобрано в DOMEO</th>
          <th style="width:12%">Цена</th>
          <th style="width:12%">Статус</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div id="actionrow" class="controls actionrow" hidden>
      <button class="primary" id="cart">Собрать корзину в DOMEO</button>
      <button id="remember">Запомнить соответствия</button>
      <button id="hist">История</button>
    </div>

    <div id="cartlink" class="cartlink" hidden></div>
    <div id="histpanel" class="histpanel" hidden></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
