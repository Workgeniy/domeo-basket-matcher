server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- security-заголовки ---
    # CSP: встроенные/вставленные скрипты не выполняются; запросы только в Diginetica.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://autocomplete.diginetica.net; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # для readiness/liveness проб k8s
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
