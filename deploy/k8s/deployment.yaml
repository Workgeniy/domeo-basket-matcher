# Манифесты под конвенцию Domeo-Infra (GitOps/ArgoCD).
# Кладутся в Domeo-Infra: deploy/services/stage/<product>/<service>/manifests/
# namespace и DNS-зона выводятся платформой из пути (<product>-<env>), Application создаёт платформа.
# Продукт/неймспейс уточнить с платформой (разрешённые: crm, cfg, cad, id) — ниже стоит crm как предположение.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podbor-korzin
  namespace: crm-stage
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels: { app: podbor-korzin }
  template:
    metadata:
      labels: { app: podbor-korzin }
    spec:
      containers:
        - name: web
          # CI после сборки заменяет на конкретный дайджест (GHCR):
          image: ghcr.io/domeocompany/domeo-basket-matcher@sha256:TODO
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: podbor-korzin
  namespace: crm-stage
spec:
  selector: { app: podbor-korzin }
  ports:
    - port: 80
      targetPort: 8080
