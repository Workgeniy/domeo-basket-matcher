apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: domeo-basket-matcher
  annotations:
    # под вашу инфраструктуру (ingress-класс, cert-manager и т.п.):
    # kubernetes.io/ingress.class: "nginx"
    # cert-manager.io/cluster-issuer: "letsencrypt"
    {}
spec:
  rules:
    # ЗАМЕНИТЬ на ваш stage-хост
    - host: podbor.stage.example.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: domeo-basket-matcher
                port:
                  number: 80
  tls:
    - hosts:
        - podbor.stage.example.ru
      secretName: domeo-basket-matcher-tls
