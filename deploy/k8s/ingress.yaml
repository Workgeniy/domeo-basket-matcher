# Ingress под конвенцию Domeo-Infra: Traefik + cert-manager, stage-зона *.test.domeohome.ru.
# Хост уточнить при активации (переключение DNS — шаг миграции сервиса).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podbor-korzin
  namespace: crm-stage
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [podbor.test.domeohome.ru]
      secretName: podbor-korzin-tls
  rules:
    - host: podbor.test.domeohome.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podbor-korzin
                port: { number: 80 }
