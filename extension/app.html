<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DOMEO · Подбор по корзине</title>
<style>
:root{
  --bg:#ffffff; --fg:#1a1a1a; --muted:#6b6b66; --border:#e4e4df; --soft:#f6f6f4;
  --accent:#ffcb05; --accent-ink:#1a1a1a;
  --good:#1f7a3d; --good-bg:#e7f3ec; --warn:#9a6b00; --warn-bg:#fbf1dc; --crit:#b4281f; --crit-bg:#f8e7e5;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1f1f23; --fg:#ececec; --muted:#9a9a98; --border:#33333a; --soft:#17171a;
  --good:#5fcf87; --good-bg:#16301f; --warn:#e0b354; --warn-bg:#2e2512; --crit:#ef7a70; --crit-bg:#331715;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:18px 18px 48px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header button{margin-left:auto;font-size:12.5px;padding:6px 11px}
header button+button{margin-left:0}
.histitem{border:1px solid var(--border);border-radius:7px;padding:8px 10px;margin-bottom:6px;background:var(--soft);font-size:13px}
.histitem .h{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:2px}
.dictbadge{color:var(--muted);font-size:12px;margin-left:4px}
#cartlink{border:1px solid var(--accent);border-radius:8px;padding:10px 12px;margin:2px 0 10px;background:var(--soft);font-size:13px}
#cartlink .u{word-break:break-all;font-family:ui-monospace,monospace;font-size:12.5px;margin-top:4px}
#cartlink .r{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
#update{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:8px 11px;margin:2px 0 10px;font-size:13px}
.logo{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;padding:5px 9px;border-radius:6px}
h1{font-size:17px;font-weight:600;margin:0}
.src{color:var(--muted);font-size:12.5px;margin:1px 0 0}
textarea{width:100%;min-height:72px;resize:vertical;border:1px solid var(--border);border-radius:7px;
  background:var(--soft);color:var(--fg);font-family:inherit;font-size:13px;padding:9px;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-weight:600;border-radius:7px;padding:9px 14px;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--fg)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.55;cursor:default}
.progress{color:var(--muted);font-size:12.5px;flex:1 1 100%;margin-top:4px}
.summary{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tile{background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:8px 12px;min-width:92px}
.tile .n{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:11px}
.item{border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--bg)}
.pos{font-weight:500;margin-bottom:6px}
.pos .q{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
select{max-width:100%;width:100%;border:1px solid var(--border);border-radius:6px;background:var(--soft);color:var(--fg);font:inherit;font-size:13px;padding:7px 8px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--crit-bg);color:var(--crit)}
.chip.load{background:var(--border);color:var(--muted)}
a.link{color:var(--muted);font-size:12px;text-decoration:none}
a.link:hover{text-decoration:underline}
.hint{color:var(--muted);font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">DOMEO</span>
    <div><h1>Подбор по корзине</h1><div class="src" id="src">—</div></div>
    <button id="hist">История</button>
  </header>

  <div id="histpanel" hidden></div>
  <div id="update" hidden></div>

  <div class="row" style="margin-bottom:8px">
    <input id="link" type="text" placeholder="Вставьте ссылку на корзину поставщика"
      style="flex:1 1 260px;border:1px solid var(--border);border-radius:7px;background:var(--soft);color:var(--fg);font:inherit;font-size:13px;padding:9px">
    <button class="primary" id="openlink">Открыть и прочитать</button>
  </div>
  <div class="hint" style="margin:-4px 0 10px">Ссылку открываем в вашем браузере (вы залогинены) и читаем — анти-бот не мешает. Это окно не закрывается, можно отодвинуть на второй экран.</div>

  <textarea id="input" spellcheck="false" placeholder="Можно вставить вручную: вывод букмарклета (с табами) или список по строке."></textarea>
  <div class="row">
    <button id="read">Прочитать корзину (из открытой вкладки)</button>
    <button id="run">Подобрать из поля</button>
    <div class="progress" id="progress"></div>
  </div>

  <div class="summary" id="summary" hidden></div>
  <div class="row" id="cartrow" hidden>
    <button class="primary" id="cart">Собрать корзину в DOMEO</button>
    <button id="remember">Запомнить соответствия</button>
  </div>
  <div id="cartlink" hidden></div>
  <div id="list"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
